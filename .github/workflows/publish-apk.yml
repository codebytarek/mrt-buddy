name: Publish Android APK

on:
  push:
    branches: [master]
    paths:
      - "composeApp/build.gradle.kts"
      - "CHANGELOG.md"
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 37
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses || true
          "$sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' composeApp/build.gradle.kts | head -n 1)
          tag="v${version}"
          apk="composeApp/build/outputs/apk/debug/composeApp-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#mrt-buddy-${tag}-debug.apk" --clobber
          else
            gh release create "$tag" "$apk#mrt-buddy-${tag}-debug.apk" \
              --title "MRT Buddy ${tag}" \
              --notes-file CHANGELOG.md
          fi
