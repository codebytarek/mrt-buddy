name: Publish Android APK

on:
  push:
    branches: [master]
    paths:
      - "composeApp/build.gradle.kts"
      - "composeApp/src/**"
      - "CHANGELOG.md"
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 37
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --channel=3 --licenses || true
          "$sdkmanager" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Upload debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: mrt-buddy-debug-apk
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

